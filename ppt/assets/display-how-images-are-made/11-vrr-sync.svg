<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Fixed refresh versus variable refresh rate</title>
  <desc id="desc">A timeline comparing a fixed display clock with a GPU and a variable refresh display.</desc>
  <rect width="1200" height="650" fill="#f1f3f5"/>
  <g fill="#0a1f3d" font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="70" y="70" font-size="30" letter-spacing="5">FIXED REFRESH</text>
    <text x="70" y="355" font-size="30" letter-spacing="5">VARIABLE REFRESH</text>
    <text x="70" y="125" font-size="20" opacity=".65">GPU frames</text>
    <text x="70" y="185" font-size="20" opacity=".65">Display scans</text>
    <text x="70" y="410" font-size="20" opacity=".65">GPU frames</text>
    <text x="70" y="470" font-size="20" opacity=".65">Display scans</text>
    <text x="860" y="255" font-size="24" fill="#a33b4b">TEARING</text>
    <text x="860" y="545" font-size="24" fill="#2f6e58">MATCHED</text>
  </g>
  <g stroke="#0a1f3d" stroke-width="3" fill="none">
    <line x1="230" y1="120" x2="1080" y2="120"/>
    <line x1="230" y1="180" x2="1080" y2="180"/>
    <line x1="230" y1="405" x2="1080" y2="405"/>
    <line x1="230" y1="465" x2="1080" y2="465"/>
  </g>
  <g fill="#a33b4b">
    <rect x="300" y="100" width="105" height="40"/><rect x="570" y="100" width="105" height="40"/><rect x="860" y="100" width="105" height="40"/>
  </g>
  <g fill="#0a1f3d">
    <rect x="270" y="160" width="105" height="40"/><rect x="500" y="160" width="105" height="40"/><rect x="730" y="160" width="105" height="40"/><rect x="960" y="160" width="105" height="40"/>
  </g>
  <g fill="#2f6e58">
    <rect x="300" y="385" width="105" height="40"/><rect x="570" y="385" width="105" height="40"/><rect x="860" y="385" width="105" height="40"/>
    <rect x="300" y="445" width="105" height="40"/><rect x="570" y="445" width="105" height="40"/><rect x="860" y="445" width="105" height="40"/>
  </g>
  <g fill="#f1f3f5" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle">
    <text x="352" y="126">A</text><text x="622" y="126">B</text><text x="912" y="126">C</text>
    <text x="322" y="186">A</text><text x="552" y="186">B</text><text x="782" y="186">C</text><text x="1012" y="186">D</text>
    <text x="352" y="411">A</text><text x="622" y="411">B</text><text x="912" y="411">C</text>
    <text x="352" y="471">A</text><text x="622" y="471">B</text><text x="912" y="471">C</text>
  </g>
</svg>
